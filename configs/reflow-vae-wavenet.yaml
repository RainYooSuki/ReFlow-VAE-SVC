data:
  f0_extractor: 'rmvpe' # 'parselmouth', 'dio', 'harvest', 'crepe' or 'rmvpe'
  f0_min: 40 
  f0_max: 1200 
  sampling_rate: 44100
  block_size: 512 # Equal to hop_length
  duration: 2 # Audio duration during training, must be less than the duration of the shortest audio clip
  encoder: 'whisper-ppg-large' # 'hubertsoft', 'hubertbase', 'hubertbase768', 'contentvec', 'contentvec768' or 'contentvec768l12' or 'cnhubertsoftfish' or 'whisper-ppg' or 'whisper-ppg-large'
  cnhubertsoft_gate: 10
  encoder_sample_rate: 16000
  encoder_hop_size: 320
  encoder_out_channels: 1280 # 256 if using 'hubertsoft', 1024 if using 'whisper-ppg', 1280 if using 'whisper-ppg-large'
  encoder_ckpt: pretrain/whisper/large-v2.pt
  train_path: data/train # Create a folder named "audio" under this path and put the audio clip in it
  valid_path: data/val # Create a folder named "audio" under this path and put the audio clip in it
  extensions: # List of extension included in the data collection
    - wav
model:
  type: 'RectifiedFlow_VAE'
  back_bone: 'wavenet'
  n_layers: 60
  n_chans: 1280
  n_hidden: 768
  use_pitch_aug: true
  use_attention: true
  n_spk: 1 # max number of different speakers
device: cuda # training device
vocoder:
  type: 'nsf-hifigan'
  ckpt: 'pretrain/nsf_hifigan/kouon_pc_nsf-hifigan.ckpt'
infer:
  infer_step: 50
  method: 'rk4' # 'euler', 'rk4'
env:
  expdir: exp/
  gpu_id: 0
train:
  num_workers: 0 # If your cpu and gpu are both very strong, set to 0 may be faster!
  amp_dtype: bf16 # fp32, fp16 or bf16 (fp16 or bf16 may be faster if it is supported by your gpu)
  batch_size: 48
  cache_all_data: true # Save Internal-Memory or Graphics-Memory if it is false, but may be slow
  cache_device: 'cuda' # Set to 'cuda' to cache the data into the Graphics-Memory, fastest speed for strong gpu
  cache_fp16: true
  epochs: 100000
  interval_log: 200
  interval_val: 2000
  interval_force_save: 10000
  lr: 0.0001
  decay_step: 100000
  gamma: 0.5
  weight_decay: 0
  save_opt: True
